name: Update Opportunity Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0,6,12,18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update opportunity intelligence
        run: python pipeline/update.py

      - name: Commit updated data
        run: |
          git config user.name "opportunity-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw_feed.json data/history.json data/intelligence.json
          git diff --cached --quiet || git commit -m "data: refresh opportunity intelligence"
          git push
