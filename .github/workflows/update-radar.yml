name: Update Opportunity Feed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pipeline/**"
      - "data/macro_observations.json"
      - "data/regional_observations.json"
      - "data/contradiction_observations.json"
      - "data/policy_observations.json"
      - "data/entity_registry.json"
      - "data/source_registry.json"
      - "data/product_release.json"
      - "*.js"
      - "*.html"
      - ".github/workflows/update-radar.yml"
  schedule:
    - cron: "15 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: opportunity-intelligence-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate frontend JavaScript
        run: |
          set -euo pipefail
          for file in \
            app.js \
            money-flow.js \
            regional-flow.js \
            contradiction-flow.js \
            lifecycle-flow.js \
            overview.js \
            action.js \
            relationship.js \
            counterparty.js \
            execution.js \
            official-release.js \
            reports.js \
            action-feedback.js \
            source-coverage.js \
            system-version.js; do
            node --check "$file"
          done

      - name: Update opportunity intelligence
        run: python pipeline/update.py

      - name: Build policy intelligence
        run: python pipeline/policy_intel.py

      - name: Build entity media discovery feed
        run: python pipeline/entity_media_intel.py

      - name: Update procurement action intelligence
        run: python pipeline/action_intel.py

      - name: Update partner and prime intelligence
        run: python pipeline/partner_intel.py

      - name: Backfill historical award results
        run: python pipeline/partner_backfill.py

      - name: Normalize procurement taxonomy
        run: python pipeline/normalize_taxonomy.py

      - name: Build buyer-vendor relationship intelligence
        run: python pipeline/relationship_intel.py

      - name: Probe official contractor schema
        run: python pipeline/contractor_schema_probe.py

      - name: Build official MSC contact intelligence
        run: python pipeline/official_contact_intel.py

      - name: Build counterparty execution dossiers
        run: python pipeline/counterparty_intel.py

      - name: Build outreach execution packs
        run: python pipeline/outreach_intel.py

      - name: Update corporate action intelligence
        run: python pipeline/corporate_intel.py

      - name: Build observed supply-side intelligence
        run: python pipeline/supply_side_intel.py

      - name: Build V2 money-flow intelligence
        run: python pipeline/money_flow_intel.py

      - name: Attach observed supply evidence to themes
        run: python pipeline/supply_gap_enrich.py

      - name: Build regional money-flow intelligence
        run: python pipeline/regional_intel.py

      - name: Build contradiction and falsification intelligence
        run: python pipeline/contradiction_intel.py

      - name: Build thesis lifecycle intelligence
        run: python pipeline/thesis_lifecycle.py

      - name: Build entity convergence intelligence
        run: python pipeline/entity_convergence.py

      - name: Audit source coverage and blind spots
        run: python pipeline/source_coverage.py

      - name: Build periodic intelligence reports
        run: python pipeline/report_intel.py

      - name: Enforce report falsification quality
        run: python pipeline/report_quality.py

      - name: Build system metadata
        run: python pipeline/system_meta.py

      - name: Publish generated data
        run: |
          set -euo pipefail
          git config user.name "opportunity-intel-bot"
          git config user.email "actions@users.noreply.github.com"

          generated_files=(
            raw_feed.json
            history.json
            intelligence.json
            policy_intelligence.json
            entity_media_history.json
            entity_media_intelligence.json
            action_history.json
            action_intelligence.json
            partner_history.json
            partner_intelligence.json
            partner_backfill_state.json
            relationship_intelligence.json
            contractor_schema_probe.json
            official_contact_intelligence.json
            counterparty_intelligence.json
            outreach_intelligence.json
            corporate_history.json
            corporate_intelligence.json
            supply_side_intelligence.json
            money_flow_intelligence.json
            regional_intelligence.json
            contradiction_intelligence.json
            theme_history.json
            thesis_lifecycle.json
            entity_convergence_intelligence.json
            source_coverage_intelligence.json
            intelligence_reports.json
            report_history.json
            system_meta.json
          )

          snapshot_dir="$(mktemp -d)"
          for file in "${generated_files[@]}"; do
            cp "data/$file" "$snapshot_dir/$file"
          done

          git fetch origin main
          git reset --hard origin/main

          for file in "${generated_files[@]}"; do
            cp "$snapshot_dir/$file" "data/$file"
          done

          git add "${generated_files[@]/#/data/}"
          if git diff --cached --quiet; then
            echo "No generated data changes to publish."
            exit 0
          fi

          git commit -m "data: refresh opportunity intelligence"
          git push origin HEAD:main
