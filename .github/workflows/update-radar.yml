name: Update Opportunity Feed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pipeline/**"
      - ".github/workflows/update-radar.yml"
  schedule:
    - cron: "15 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: opportunity-intelligence-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update opportunity intelligence
        run: python pipeline/update.py

      - name: Update procurement action intelligence
        run: python pipeline/action_intel.py

      - name: Update partner and prime intelligence
        run: python pipeline/partner_intel.py

      - name: Normalize procurement taxonomy
        run: python pipeline/normalize_taxonomy.py

      - name: Update corporate action intelligence
        run: python pipeline/corporate_intel.py

      - name: Commit updated data
        run: |
          git config user.name "opportunity-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw_feed.json data/history.json data/intelligence.json data/action_history.json data/action_intelligence.json data/partner_history.json data/partner_intelligence.json data/corporate_history.json data/corporate_intelligence.json
          git diff --cached --quiet || git commit -m "data: refresh opportunity intelligence"
          git pull --rebase origin main
          git push
